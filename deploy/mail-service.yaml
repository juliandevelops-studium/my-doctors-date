apiVersion: v1
kind: Service
metadata:
  name: mail-service
  namespace: praxis
  labels: {app: mail-service}
spec:
  selector: {app: mail-service}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-service
  namespace: praxis
  labels: {app: mail-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mail-service}
  template:
    metadata:
      labels: {app: mail-service}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # secret files are group-readable (mode 0440), never world-readable
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mail-service
          image: praxis/mail-service:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: SERVICE_KEYS_DIR, value: /etc/praxis/service-keys}
            - name: PUBLIC_BASE_URL
              valueFrom: {configMapKeyRef: {name: praxis-config, key: PUBLIC_BASE_URL}}
            - name: PRACTICE_NAME
              valueFrom: {configMapKeyRef: {name: praxis-config, key: PRACTICE_NAME}}
            - {name: SMTP_HOST, value: mailpit}
            - {name: SMTP_PORT, value: "1025"}
            - {name: SMTP_TLS, value: none}
            - {name: SMTP_FROM, value: "praxis@praxis.localhost"}
            - {name: PRACTICE_TZ, value: Europe/Berlin}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: service-keys, mountPath: /etc/praxis/service-keys, readOnly: true}
      volumes:
        - name: service-keys
          configMap: {name: service-keys}
