# Default deny
# INGRESS none for all pods.
# EGRESS none for all pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: praxis
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve names through the cluster DNS
# INGRESS none.
# EGRESS all pods -> kube-dns (UDP/TCP 53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: praxis
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Frontend talking
# INGRESS Traefik -> frontend.
# EGRESS frontend -> user-service and frontend -> calendar-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: user-service}}
        - podSelector: {matchLabels: {app: calendar-service}}
      ports:
        - {protocol: TCP, port: 8080}
---
# User service talking
# INGRESS frontend -> user-service and calendar-service -> user-service (public keys, JWKS).
# EGRESS user-service -> database-middleware and user-service -> mail-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: user-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: calendar-service}} # public keys (JWKS)
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: database-middleware}}
        - podSelector: {matchLabels: {app: mail-service}}
      ports:
        - {protocol: TCP, port: 8080}
---
# Calendar service talking
# INGRESS frontend -> calendar-service.
# EGRESS calendar-service -> database-middleware, calendar-service -> mail-service and calendar-service -> user-service (JWKS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: calendar-service
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: calendar-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: database-middleware}}
        - podSelector: {matchLabels: {app: mail-service}}
        - podSelector: {matchLabels: {app: user-service}}
      ports:
        - {protocol: TCP, port: 8080}
---
# Purge job talking
# INGRESS none.
# EGRESS purge-job -> database-middleware
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: purge-job
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: purge-job}}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: database-middleware}}
      ports:
        - {protocol: TCP, port: 8080}
---
# Mail service talking
# INGRESS user-service -> mail-service and calendar-service -> mail-service.
# EGRESS mail-service -> mailpit (SMTP, port 1025)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail-service
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: mail-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: user-service}}
        - podSelector: {matchLabels: {app: calendar-service}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: mailpit}}
      ports:
        - {protocol: TCP, port: 1025}
---
# Database middleware talking
# INGRESS user-service, calendar-service and purge-job -> database-middleware.
# EGRESS database-middleware -> postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-middleware
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: database-middleware}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: user-service}}
        - podSelector: {matchLabels: {app: calendar-service}}
        - podSelector: {matchLabels: {app: purge-job}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
      ports:
        - {protocol: TCP, port: 5432}
---
# Postgres talking
# INGRESS database-middleware -> postgres and migrate -> postgres.
# EGRESS none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: database-middleware}}
        - podSelector: {matchLabels: {app: migrate}}
      ports:
        - {protocol: TCP, port: 5432}
---
# The migration job needs the database and nothing else.
# INGRESS none.
# EGRESS migrate -> postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: migrate}}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
      ports:
        - {protocol: TCP, port: 5432}
---
# mail_service -> mailpit SMTP only.
# INGRESS mail-service -> mailpit.
# EGRESS none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
  namespace: praxis
spec:
  podSelector: {matchLabels: {app: mailpit}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: mail-service}}
      ports:
        - {protocol: TCP, port: 1025}
