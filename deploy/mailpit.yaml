# Demo SMTP server. It keeps messages in memory, delivers nothing to the outside, and its UI is not exposed by the
# ingress (use `make mail-ui`).
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: praxis
  labels: {app: mailpit}
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: ui, port: 8025, targetPort: ui}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: praxis
  labels: {app: mailpit}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
          env:
            - {name: MP_SMTP_BIND_ADDR, value: "0.0.0.0:1025"}
            - {name: MP_UI_BIND_ADDR, value: "0.0.0.0:8025"}
            - {name: MP_MAX_MESSAGES, value: "500"}
            - {name: MP_DATABASE, value: "/tmp/mailpit.db"}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: ui, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /livez, port: ui}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: ui}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
