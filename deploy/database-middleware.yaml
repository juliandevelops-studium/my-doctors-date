apiVersion: v1
kind: Service
metadata:
  name: database-middleware
  namespace: praxis
  labels: { app: database-middleware }
spec:
  selector: { app: database-middleware }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-middleware
  namespace: praxis
  labels: { app: database-middleware }
spec:
  replicas: 1
  selector:
    matchLabels: { app: database-middleware }
  template:
    metadata:
      labels: { app: database-middleware }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # secret files are group-readable (mode 0440), never world-readable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: database-middleware
          image: praxis/database-middleware:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: middleware-db, key: url } }
            - { name: SERVICE_KEYS_DIR, value: /etc/praxis/service-keys }
            - { name: PRACTICE_TZ, value: Europe/Berlin }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts:
            - { name: service-keys, mountPath: /etc/praxis/service-keys, readOnly: true }
            - { name: postgres-ca, mountPath: /etc/praxis/postgres-ca, readOnly: true }
      volumes:
        - name: service-keys
          configMap: { name: service-keys }
        - name: postgres-ca
          configMap: { name: postgres-ca }
