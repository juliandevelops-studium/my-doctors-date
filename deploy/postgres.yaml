# PostgreSQL 16
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: praxis
  labels: {app: postgres}
data:
  pg_hba.conf: |
    # Local socket (health check, initdb) inside the container only.
    local all all trust
    # Network: TLS and a password, nothing else.
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::/0 scram-sha-256
  10-roles.sh: |
    #!/bin/sh
    # Runs once when the data directory is created.
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    CREATE ROLE praxis_owner LOGIN PASSWORD '$OWNER_PASSWORD';
    CREATE ROLE praxis_app LOGIN PASSWORD '$APP_PASSWORD';
    CREATE DATABASE praxis OWNER praxis_owner;
    REVOKE ALL ON DATABASE praxis FROM PUBLIC;
    GRANT CONNECT ON DATABASE praxis TO praxis_app;
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname praxis <<SQL
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO praxis_owner;
    GRANT USAGE ON SCHEMA public TO praxis_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE praxis_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO praxis_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE praxis_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO praxis_app;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: praxis
  labels: {app: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: praxis
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgres-config/pg_hba.conf
            - -c
            - password_encryption=scram-sha-256
            - -c
            - listen_addresses=*
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: superuser-password}}
            - name: OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: owner-password}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: app-password}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432"]}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432"]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /etc/postgres-tls, readOnly: true}
            - {name: config, mountPath: /etc/postgres-config, readOnly: true}
            - {name: config, mountPath: /docker-entrypoint-initdb.d/10-roles.sh, subPath: 10-roles.sh, readOnly: true}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: tls
          secret: {secretName: postgres-tls, defaultMode: 288}
        - name: config
          configMap: {name: postgres-config, defaultMode: 365}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app: postgres}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
