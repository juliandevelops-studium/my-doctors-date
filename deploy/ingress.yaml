# The only way in from outside
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: praxis
  namespace: praxis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ praxis.localhost ]
      secretName: praxis-tls
  rules:
    - host: praxis.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
